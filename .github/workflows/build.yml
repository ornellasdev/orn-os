name: Build Orn OS
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Compilar e Enviar Imagem do Orn OS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Limpar espaço no servidor (Evita erros de disco cheio)
        uses: ubuntu-ci/rm-ubuntu-initramfs@v1

      - name: Compilar a imagem do sistema (Containerfile)
        id: build_image
        uses: redhat-actions/buildah-build@v3  # Atualizado para v3 conforme o aviso do GitHub
        with:
          containerfiles: |
            ./Containerfile
          image: orn-os
          tags: latest

      - name: Publicar imagem no GitHub Container Registry (GHCR)
        uses: redhat-actions/push-to-registry@v3  # Atualizado para v3
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
