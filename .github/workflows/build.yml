
name: Build Orn OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Compilar e Enviar Imagem do Orn OS
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Liberar espaço de disco nativamente
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Compilar a imagem do sistema (Containerfile)
        id: build_image
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: |
            ./Containerfile
          image: orn-os
          tags: latest

      - name: Publicar imagem no GitHub Container Registry (GHCR)
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
